<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0c0c12">
<style>
  :root {
    --bg: #0c0c12; --panel: #15151d; --line: #282834; --text: #f0eef8; --dim: #a4a2b6;
    --hot: #c8102e; --lib: #f6f1e7; --ok: #9be36b; --warn: #ffc24a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "Helvetica Neue", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 56px 40px 96px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 58px; height: 58px; flex: none; }
  h1 { font-size: 54px; line-height: .95; letter-spacing: -.03em; margin: 0; font-weight: 800; }
  h1 span { color: var(--hot); }
  .sub { color: var(--dim); margin-top: 10px; }
  .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  a.ghost, button { font: inherit; font-weight: 600; border-radius: 999px; cursor: pointer; padding: 10px 18px; background: transparent;
    color: var(--text); border: 1px solid var(--line); text-decoration: none; display: inline-block; }
  a.ghost.lib { background: var(--lib); color: var(--hot); border-color: var(--lib); font-weight: 700; }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .find { margin: 40px 0 14px; position: relative; }
  .find input { width: 100%; background: #09090e; color: var(--text); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 44px 15px 18px; font: 17px inherit; font-family: inherit; }
  .find button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; padding: 0; border: 0;
    font-size: 20px; line-height: 1; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chips button { padding: 7px 14px; font-size: 14px; }
  .chips button[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff; }
  .count { color: var(--dim); font-size: 14px; min-height: 22px; margin: 6px 2px 26px; }

  section.topic { margin-bottom: 38px; scroll-margin-top: 20px; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
  details { border-top: 1px solid var(--line); scroll-margin-top: 20px; }
  details:last-child { border-bottom: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 15px 34px 15px 0; font-weight: 600; font-size: 17px; position: relative; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; position: absolute; right: 4px; top: 11px; font-size: 22px; font-weight: 400; color: var(--dim); transition: transform .2s; }
  details[open] > summary::after { transform: rotate(45deg); }
  .a { padding: 0 0 18px; color: #c3c1d0; max-width: 680px; }
  .a p { margin: 0 0 8px; } .a ol, .a ul { margin: 0 0 8px; padding-left: 22px; } .a li { margin: 2px 0; }
  .a b { color: var(--text); } .a code { font: 14px var(--mono); background: #09090e; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .a a { color: var(--lib); }
  .a .link { font-size: 13.5px; color: var(--dim); }
  .a .link a { color: var(--dim); }
  mark { background: rgba(255, 194, 74, .28); color: inherit; border-radius: 3px; padding: 0 1px; }
  details.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: rgba(200, 16, 46, .22); } to { background: transparent; } }
  .none { border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--dim); }
  .none b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .more { margin-top: 28px; color: var(--dim); font-size: 15px; }
  .more a { color: var(--lib); }
  @media (max-width: 820px) { main { padding: 32px 16px 72px; } h1 { font-size: 40px; } .brand img { width: 44px; height: 44px; } summary { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { summary::after { transition: none; } details.flash { animation: none; } }
</style>
</head>

<main>
  <header>
    <div>
      <div class="brand"><img src="/icon.svg" alt=""><h1>Quick <span>answers</span></h1></div>

    </div>
    <div class="acts">
      <a class="ghost" href="/#tour">Take the tour</a>
      <a class="ghost" href="/dj">Library Manager</a>
      <a class="ghost lib" href="/">&larr; The Crate</a>
    </div>
  </header>

  <div class="find" role="search">
    <input id="q" type="search" placeholder="Search questions and answers" spellcheck="false" autocomplete="off" aria-label="Search the FAQ" autofocus>
    <button id="clear" aria-label="Clear the search" hidden>&times;</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Topics"></div>
  <div class="count" id="count" role="status" aria-live="polite"></div>
  <div id="list"></div>
  <p class="more">Still stuck? The <b>?</b> beside each setting on the pages says what it does, what it never touches and how to undo it.</p>
</main>
<script>
// Every answer is plain and short. They come from the pages' own "? How it works" notes, each feature's "?" and the README.
const TOPICS = [
  ['sync', 'Syncing'], ['soulseek', 'Soulseek and quality'], ['liked', 'Liked Songs'],
  ['usb', 'USB and decks'], ['decks', 'rekordbox and Engine'], ['privacy', 'Privacy and what it never touches'],
];
const FAQ = [
  // ---- Syncing
  { t: 'sync', id: 'what-it-does', q: 'What does The Crate do?',
    a: '<p>It gets every track in your playlists onto your Mac in top quality, then onto your DJ USB. It runs by itself every day at your Auto sync time, or when you press <b>Sync Now</b>. It never deletes anything.</p>' },
  { t: 'sync', id: 'get-started', q: 'How do I get started?', k: 'first setup begin checklist',
    a: '<ol><li>Paste a playlist link and press <b>Add</b>.</li><li>Sign in to Soulseek (recommended).</li><li>Pick your USB if you have one.</li><li>Press <b>Sync Now</b>.</li></ol><p>The <b>Get started</b> list at the top of the page ticks each step by itself.</p>' },
  { t: 'sync', id: 'which-playlists', q: 'Which playlists work?', k: 'spotify apple music soundcloud link public share',
    a: '<p>Public <b>SoundCloud</b>, <b>Spotify</b> and <b>Apple Music</b> playlists. In the service, open the playlist, <b>Share &gt; Copy link</b>, and paste it.</p><p>Spotify and Apple Music only stream, so The Crate reads the song list and finds each song elsewhere. Spotify shows the first 100 songs (paste the rest in the same box); Apple Music up to 300.</p>' },
  { t: 'sync', id: 'where-songs-come-from', q: 'Where do the songs come from?', k: 'sources order download free original',
    a: '<p>Best first:</p><ol><li><b>SoundCloud</b>: the artist\'s original file.</li><li><b>Free download links</b> from the artist.</li><li><b>Soulseek</b>: download only.</li><li><b>Your Downloads folder</b>: anything you bought or unlocked.</li></ol><p>Never YouTube or a recorded stream.</p>' },
  { t: 'sync', id: 'song-not-found', q: 'A song wasn\'t found. What now?', k: 'missing buy shop bandcamp beatport traxsource juno qobuz downloads',
    a: '<p>It stays in <b>Left to find</b> with shop links (Bandcamp, Beatport, Traxsource, Juno, Qobuz) and in <i>To Buy.txt</i> in your music folder.</p><p>Buy or unlock it, then leave the file in your <b>Downloads</b> folder. It\'s picked up within a minute if the title is in the file name, the length matches and it\'s top quality.</p>' },
  { t: 'sync', id: 'free-links', q: 'What are Free links?', k: 'hypeddit toneden gate follow claude codex assistant',
    a: '<p>Free downloads that sit behind a click or a follow (Hypeddit, ToneDen and the like). They\'re listed for you to click, and the file then arrives through Downloads.</p><p>You can also hand the list to Claude or Codex on your Mac with <b>Let an assistant get them</b>.</p>' },
  { t: 'sync', id: 'first-sync-slow', q: 'Why does the first sync take so long?', k: 'slow hours wait',
    a: '<p>Soulseek limits how fast it can be searched, so nobody gets blocked. A big playlist takes a few hours the first time; after that, only new tracks.</p>' },
  { t: 'sync', id: 'keep-open', q: 'Do I have to keep it open?', k: 'asleep mac schedule daily auto sync time',
    a: '<p>No. Keep your Mac on and plugged in at your <b>Auto sync</b> time (3:10am to start). If it\'s asleep, it syncs when it wakes. Plug in your USB whenever.</p>' },
  { t: 'sync', id: 'retake-tour', q: 'How do I take the tour again?', k: 'tutorial guide walkthrough help replay',
    a: '<p>Press <b>Take the tour</b> at the top of The Crate or the Library Manager. It walks through both pages. The Crate remembers you\'ve seen it in its own folder, so it won\'t start by itself again.</p>' },
  { t: 'sync', id: 'uninstall', q: 'How do I remove it?', k: 'uninstall delete remove',
    a: '<p>Paste <code>zsh ~/TheCrate/uninstall.sh</code> into Terminal. Your music stays in Music &gt; SoundCloud Sync.</p>' },
  { t: 'sync', id: 'windows', q: 'Does it work on Windows?', k: 'pc linux platform',
    a: '<p>Not yet. It\'s Mac only: it uses macOS for background jobs, audio checks and the Keychain.</p>' },

  // ---- Soulseek and quality
  { t: 'soulseek', id: 'quality', q: 'What quality do I get?', k: '320 kbps lossless flac wav aiff mp3 bitrate',
    a: '<p><b>Lossless</b> (WAV, FLAC, AIFF) or <b>320 kbps</b> MP3, never a recorded stream. The page flags any file under 320 kbps. The artist\'s own upload replaces a Soulseek file when it arrives.</p>' },
  { t: 'soulseek', id: 'what-is-soulseek', q: 'What is Soulseek, and do I need an account?', k: 'slsk login sign in password keychain sockseek',
    a: '<p>A free network where people share music. It\'s the last fallback, for what SoundCloud, Spotify and Apple Music won\'t give you.</p><p>Make up a name and a new password you use nowhere else; the account is created the first time. It\'s kept in your Mac\'s Keychain. It only downloads: your files are never shared.</p>' },
  { t: 'soulseek', id: 'right-song', q: 'How does it know it\'s the right song?', k: 'wrong version remix length check judge',
    a: '<p>The title must match and the length must be within 5 seconds of the SoundCloud track, so you get the same mix. Once the file is here it\'s checked again: its real length, the song named inside it, and whether it\'s someone else\'s remix.</p><p>A wrong one goes to the Trash and that file is never taken again.</p>' },
  { t: 'soulseek', id: 'wrong-or-bad', q: 'I got the wrong song, or a bad copy', k: 'bad file throw back trash again replace',
    a: '<p>Press <b>Wrong or bad file</b> under the song. It goes to the Trash (never deleted), comes off your USB too, and The Crate starts looking for another copy right away. That file and that person are never taken again.</p>' },
  { t: 'soulseek', id: 'turned-away', q: 'A file was turned away for its length', k: 'use this file duration mismatch',
    a: '<p>If you know it\'s the right song, press <b>Use this file</b> and it\'s kept.</p>' },
  { t: 'soulseek', id: 'below-gig', q: 'What does "below gig quality" mean?', k: 'quality mp3 aac thin club better copy',
    a: '<p>An MP3 under 320 kbps, or an AAC under 256. Fine at home, thin on a club system. <b>Find a better copy</b> asks Soulseek, and you keep your file until the better one lands.</p>' },

  // ---- Liked Songs
  { t: 'liked', id: 'what-liked', q: 'What are Spotify Liked Songs here?', k: 'spotify likes favourites favorites batch edm',
    a: '<p>Optional. Paste your Liked Songs into the playlist box and each sync looks for the next batch on Soulseek, EDM first and newest first, then everything else. They go into their own folder so you can sort them into your playlists yourself.</p>' },
  { t: 'liked', id: 'paste-liked', q: 'How do I paste them?', k: 'copy shift click command c',
    a: '<p>In Spotify open Liked Songs, click the newest song, Shift-click the oldest you want, press <b>⌘C</b> and paste into the same box as your playlist links. Liked more? Paste again.</p>' },
  { t: 'liked', id: 'liked-space', q: 'Will it fill up my Mac?', k: 'disk storage space gb free floor',
    a: '<p>No. It only takes what fits and always leaves some space free (10 GB to start). The page says when it\'s paused for space. Change the folder, order or free space under <b>Liked Songs options</b>.</p>' },
  { t: 'liked', id: 'liked-spotify', q: 'Does it sign in to Spotify or change my likes?', k: 'account privacy',
    a: '<p>No. There\'s no Spotify sign-in, and nothing changes in Spotify.</p>' },
  { t: 'liked', id: 'liked-stop', q: 'How do I stop it?', k: 'forget clear undo',
    a: '<p>Press the <b>×</b> next to Liked Songs in your playlists. Songs already on your Mac stay.</p>' },
  { t: 'liked', id: 'liked-decks', q: 'Where do Liked Songs show up on my decks?', k: 'genre playlist apart',
    a: '<p>They keep their own folder and their own playlist. A song joins a genre playlist once you give it a genre. You can switch that under the Library Manager\'s <b>Options</b>.</p>' },

  // ---- USB and decks
  { t: 'usb', id: 'usb-copy', q: 'How do songs get onto my USB?', k: 'copy now plug folder soundcloud sync',
    a: '<p>New songs are copied after every sync and whenever you plug the USB in, into one folder, <b>SoundCloud Sync</b>. Press <b>Copy Now</b> to do it at once.</p>' },
  { t: 'usb', id: 'usb-has-things', q: 'My USB already has things on it', k: 'ask first friend go ahead not now stick',
    a: '<p>Nothing on it is touched until you press <b>Go ahead</b>. The page shows what would be added, what\'s never touched and how to undo. After that, songs go only into The Crate\'s own folder. An empty USB needs no asking.</p>' },
  { t: 'usb', id: 'usb-delete', q: 'Does it ever delete anything from my USB?', k: 'remove overwrite trash',
    a: '<p>It only adds. The one exception: a song you threw back with <b>Wrong or bad file</b> leaves the USB too, into the USB\'s own Trash, so you can take it back. Only The Crate\'s own folder on the USB is ever touched.</p>' },
  { t: 'usb', id: 'usb-eject', q: 'Can it eject the USB for me?', k: 'pull out safely notice',
    a: '<p>Yes. Tick <b>Eject the USB once a sync has put its new tracks on it</b>. It never ejects mid-sync, and it\'s off until you tick it. You also get a Mac notice when new tracks land.</p>' },
  { t: 'usb', id: 'usb-to-soundcloud', q: 'Can I turn the folders on my USB into SoundCloud playlists?', k: 'private playlist folder rekordbox make',
    a: '<p>Yes. In <b>USB to SoundCloud</b> on The Crate, tick the folders you want and press <b>Make playlists</b>. Each becomes a <b>private</b> playlist named after its folder, or one playlist for all (<b>Options</b>). Claude or Codex finds each song in your Chrome and checks artist, title and length; unsure ones wait for your look.</p><p>It never uploads files, makes anything public or changes your USB. To undo, delete the playlist on SoundCloud.</p>' },
  { t: 'usb', id: 'usb-folders', q: 'How are songs filed on the USB?', k: 'layout one folder edm other genre',
    a: '<p>In <b>One folder</b>, in <b>EDM and Other</b>, or <b>by genre</b> (EDM/Dubstep, Other/Hip Hop). You pick in the Library Manager; it asks before moving anything. New songs are filed by themselves, and <b>One folder</b> puts every song back.</p>' },
  { t: 'usb', id: 'genres', q: 'Where do genres come from?', k: 'tags essentia sound no genre yet playlist',
    a: '<p>Your own pick always wins. Otherwise: the file\'s tag, SoundCloud\'s genre, what the song sounds like, SoundCloud\'s tags, or a genre word in the title. A song can have several; the first is the one the decks show. Each genre is a playlist on your decks.</p>' },
  { t: 'usb', id: 'mp3', q: 'Why are my songs 320 MP3s?', k: 'mp3 320 lossless flac wav aiff icloud room space originals quality',
    a: '<p>With <b>320 MP3s on this Mac and USB</b> switched on (Options), each lossless song (FLAC, WAV, AIFF) becomes a 320 kbps MP3: a quarter of the room, and every deck plays it. Each MP3 is played back against its original before anything changes, and its playlists, cues and grids follow it.</p><p>The lossless original is kept in your iCloud Drive, in The Crate\'s <b>Lossless originals</b> folder. <b>Undo</b> on the song brings it back.</p>' },
  { t: 'usb', id: 'aiff', q: 'Why did my FLAC become an AIFF?', k: 'convert flac aiff club cdj older decks',
    a: '<p>Older club decks skip FLAC. With MP3s off, a new FLAC becomes an AIFF by itself: the same sound, bit for bit, with its cover, tags, playlists and cues. The FLAC goes to the Trash only once the AIFF is checked. <b>Undo</b> is on the song\'s row.</p>' },
  { t: 'usb', id: 'usb-lost', q: 'My USB is lost or broken. Can I get it all back?', k: 'backup restore repair lost broken stolen new usb icloud rebuild',
    a: '<p>Yes. Each time you plug it in, its deck libraries (cues, grids, playlists, history) and any song only it has are backed up to your iCloud Drive, or this Mac when iCloud is off. Your other songs are already on this Mac.</p><ol><li>Plug in a new USB and pick it on The Crate.</li><li>In the Library Manager, under <b>Backup &amp; repair</b>, press <b>Repair this USB</b>.</li><li>Keep it plugged in until it\'s done.</li></ol><p>A USB that won\'t open at all needs erasing first, in Disk Utility.</p>' },
  { t: 'usb', id: 'cover-details', q: 'What does Add cover & details do?', k: 'artwork tags title artist album year musicbrainz',
    a: '<p>It fills only what\'s empty: cover, title, artist, album, genre, year. It writes only when its sources agree (the song\'s SoundCloud page, Apple Music, MusicBrainz). If they don\'t, you choose from two or three. <b>Undo</b> is on the song\'s row.</p>' },
  { t: 'usb', id: 'club-check', q: 'What is the Club check?', k: 'gig venue cdj 3000 2000nxs2 ready',
    a: '<p>It tells you what a club\'s decks need from your USB before a gig. Older Pioneer decks (CDJ-3000, CDJ-2000NXS2) read an older list on the USB: The Crate keeps that one up too, once rekordbox has exported to the USB one time.</p>' },
  { t: 'usb', id: 'friend-usb', q: 'Can I copy songs from a friend\'s USB?', k: 'another usb copy library share',
    a: '<p>Yes. Plug it in and a line appears in the Library Manager. Open it, tick its playlists or folders and press <b>Copy to my library</b>.</p><p>Songs land in your library first, so they get the safety check, tempo, key, genres and every deck. Ones you already have aren\'t copied twice, and the other USB is only read.</p>' },
  { t: 'usb', id: 'recognise', q: 'What is song recognition?', k: 'acoustid key fingerprint chromaprint identify',
    a: '<p>It listens to each song and looks it up by its sound. That fills in missing genres and warns you when a Soulseek file is really another song. It needs a free AcoustID key, set up once. Only a sound fingerprint leaves your Mac, never the song.</p>' },
  { t: 'usb', id: 'update-now', q: 'What does Update decks now do?', k: 'run button refresh write',
    a: '<p>It sends new songs, genres, tempo and key to your USB and rekordbox right away. It also happens by itself after every sync. rekordbox must be closed; it catches up when you close it.</p>' },

  // ---- rekordbox and Engine
  { t: 'decks', id: 'which-decks', q: 'Which decks and apps does it write to?', k: 'denon prime numark engine serato cdj xdj opus omnis pioneer',
    a: '<ul><li><b>Engine DJ</b> on your USB: Denon and Numark decks</li><li><b>rekordbox</b> on this Mac: your Collection</li><li><b>rekordbox</b> on your USB: shown under the USB, and read by the newest club decks (CDJ-3000X, XDJ-AZ, OPUS-QUAD, OMNIS-DUO)</li><li><b>Serato</b> on your USB: its crates (written from Serato\'s published layout, not yet tried in Serato itself)</li></ul>' },
  { t: 'decks', id: 'the-crate-folder', q: 'Where do my songs show up in each app?', k: 'playlist folder all songs newest 50 edm other liked',
    a: '<p>In one folder called <b>The Crate</b>: All songs, Newest 50, your SoundCloud playlists, Liked Songs, <b>EDM (all)</b>, <b>Other (all)</b> and one list per genre. The songs themselves sit on the USB once, in The Crate\'s own folder.</p>' },
  { t: 'decks', id: 'rekordbox-open', q: 'rekordbox is open. What happens?', k: 'closed running wait catch up',
    a: '<p>Nothing is written while rekordbox is open, because that could damage its library. It catches up as soon as you close it.</p>' },
  { t: 'decks', id: 'cues', q: 'Do my cues follow my songs?', k: 'hot cues memory loops sync prime',
    a: '<p>Yes. Hot cues, memory cues and loops you set anywhere reach the Prime 4, rekordbox on this Mac and your USB for club decks. The newest edit wins, nothing is deleted, and <b>Undo</b> on the Cues line puts the last change back.</p><p>Not carried: MP3 cues to or from the Prime 4, memory cues to the Prime 4, and beat grids.</p>' },
  { t: 'decks', id: 'grids', q: 'Does it change my beat grids or analysis?', k: 'bpm tempo key analysis waveform',
    a: '<p>No. The decks\' own analysis and grids are never touched; each app keeps its own. Where rekordbox or a deck has analysed a song, The Crate shows that tempo everywhere.</p><p>For the rest it counts the tempo itself, twice, and uses it only when both counts agree. If they don\'t, the tempo stays blank and your decks work it out when they load the song.</p>' },
  { t: 'decks', id: 'backups', q: 'Is my library backed up before changes?', k: 'undo restore dj-backups safe',
    a: '<p>Yes. Each library file is copied to <b>dj-backups</b> before every change (the last 20 are kept), and your USB\'s whole library is backed up each time you plug it in.</p>' },

  // ---- Privacy and what it never touches
  { t: 'privacy', id: 'never-touches', q: 'What does it never touch?', k: 'own files playlists folders delete move rename',
    a: '<ul><li>Your own files, folders and playlists on the USB, and anything outside The Crate\'s own folder in Engine, rekordbox or Serato.</li><li>Your playlists and account on SoundCloud, Spotify and Apple Music: it only reads the song list.</li><li>Your songs: none is ever deleted.</li></ul>' },
  { t: 'privacy', id: 'leaves-mac', q: 'Does anything leave my Mac?', k: 'upload data account tracking ai cloud',
    a: '<p>No account with us, and nothing comes to us. USB backups and lossless originals go only to your own iCloud Drive (or your own cloud, if you pick one). Your Soulseek password stays in the Keychain, and your SoundCloud sign-in only ever goes to SoundCloud.</p><p>If you use them, song recognition sends a sound fingerprint (never the song) to AcoustID, and cover & details look songs up by title and artist on SoundCloud, Apple Music and MusicBrainz.</p>' },
  { t: 'privacy', id: 'safe-files', q: 'Are the files safe?', k: 'virus clamav quarantine malware scan',
    a: '<p>Every file is checked before it counts or goes on your USB: real audio (name, contents, and macOS can play it) and clean in the free ClamAV virus scanner. Anything else goes to <b>Quarantine</b> and can\'t run.</p>' },
  { t: 'privacy', id: 'full-disk-access', q: 'Why does it ask for Full Disk Access?', k: 'permission macos helper crate helper sign-in browser',
    a: '<p>For SoundCloud only. Your browser keeps your SoundCloud sign-in in a folder macOS locks, and this lets The Crate use it, so you get the original files without typing a password into The Crate. The button opens System Settings: drag <b>Crate Helper</b> into the list and switch it on.</p>' },
  { t: 'privacy', id: 'sharing', q: 'Does it share my music on Soulseek?', k: 'upload seed share peer',
    a: '<p>No. It only downloads.</p>' },
  { t: 'privacy', id: 'local-only', q: 'Is the page on the internet?', k: 'localhost 4780 website port network',
    a: '<p>No. It runs only on your Mac, and other websites you have open can\'t press its buttons.</p>' },
  { t: 'privacy', id: 'tools', q: 'What does it use?', k: 'yt-dlp sockseek clamav essentia mutagen pyrekordbox open source',
    a: '<p>Free, open-source tools on your Mac: <b>yt-dlp</b> (SoundCloud), <b>sockseek</b> (Soulseek), <b>ClamAV</b> (virus scan), <b>Essentia</b> (tempo and key), <b>Mutagen</b> (song details), <b>pyrekordbox</b> (rekordbox libraries) and Chromaprint with AcoustID and MusicBrainz (recognition). No AI, no account.</p>' },
];

const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const text = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };
const hay = FAQ.map(f => norm(f.q + ' ' + text(f.a) + ' ' + (f.k || '')));
let topic = '', query = '';

// "songs" finds "song": a long word is cut back to its stem.
const words = s => norm(s).split(/[^a-z0-9+&]+/).filter(Boolean).map(w => w.length > 3 ? w.replace(/(es|s)$/, '') : w);
function hit(i, ws) { return ws.every(w => hay[i].includes(w)); }

function mark(root, ws) {
  if (!ws.length) return;
  const re = new RegExp('(' + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    if (!re.test(n.nodeValue)) { re.lastIndex = 0; continue; }
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    n.nodeValue.split(re).forEach((part, i) => {
      if (i % 2) { const m = document.createElement('mark'); m.textContent = part; frag.appendChild(m); }
      else if (part) frag.appendChild(document.createTextNode(part));
    });
    n.replaceWith(frag);
  }
}

function render() {
  const ws = words(query), list = $('list');
  list.replaceChildren();
  let shown = 0;
  for (const [key, name] of TOPICS) {
    if (topic && topic !== key) continue;
    const items = FAQ.map((f, i) => [f, i]).filter(([f, i]) => f.t === key && hit(i, ws));
    if (!items.length) continue;
    const sec = document.createElement('section'); sec.className = 'topic'; sec.id = 'topic-' + key;
    const h = document.createElement('h2'); h.textContent = name; sec.appendChild(h);
    for (const [f] of items) {
      const d = document.createElement('details'); d.id = 'q-' + f.id;
      d.open = ws.length > 0;  // a search shows the answers
      const s = document.createElement('summary'); s.textContent = f.q;
      const a = document.createElement('div'); a.className = 'a'; a.innerHTML = f.a;
      const l = document.createElement('p'); l.className = 'link';
      l.innerHTML = '<a href="#q-' + f.id + '">Link to this answer</a>';
      a.appendChild(l);
      d.append(s, a);
      if (ws.length) { mark(s, ws); mark(a, ws); }
      sec.appendChild(d); shown++;
    }
    list.appendChild(sec);
  }
  if (!shown) {
    const n = document.createElement('div'); n.className = 'none';
    n.innerHTML = '<b>Nothing matches that</b>Try fewer or simpler words, like "usb", "quality" or "delete".';
    list.appendChild(n);
  }
  $('count').textContent = ws.length || topic ? (shown ? shown + (shown === 1 ? ' answer' : ' answers') : '') : FAQ.length + ' answers';
  $('clear').hidden = !query;
}

function chips() {
  const box = $('chips');
  box.replaceChildren(...[['', 'All'], ...TOPICS].map(([k, name]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.dataset.k = k;
    b.setAttribute('aria-pressed', String(topic === k));
    b.onclick = () => { topic = k; chips(); render(); sync(); };
    return b;
  }));
}

// The address carries the search (?q=) so a search can be linked; #q-… is one answer.
function sync() {
  const u = new URL(location.href);
  query ? u.searchParams.set('q', query) : u.searchParams.delete('q');
  topic ? u.searchParams.set('t', topic) : u.searchParams.delete('t');
  history.replaceState(null, '', u.pathname + u.search + u.hash);
}

function goTo(id) {
  let d = $(id);
  if (!d && /^q-/.test(id) && FAQ.some(f => 'q-' + f.id === id)) {  // filtered out: clear the filters to show it
    query = ''; topic = ''; $('q').value = ''; chips(); render(); sync(); d = $(id);
  }
  if (!d) return;
  if (d.tagName === 'DETAILS') {
    d.open = true;
    d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash');
  }
  d.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

$('q').addEventListener('input', e => { query = e.target.value; render(); sync(); });
$('clear').onclick = () => { query = ''; $('q').value = ''; render(); sync(); $('q').focus(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && query) { $('clear').click(); }
  else if (e.key === '/' && document.activeElement !== $('q') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $('q').focus(); }
});
addEventListener('hashchange', () => goTo(location.hash.slice(1)));

const p = new URLSearchParams(location.search);
query = p.get('q') || ''; topic = TOPICS.some(t => t[0] === p.get('t')) ? p.get('t') : '';
$('q').value = query;
chips(); render();
if (location.hash.length > 1) goTo(location.hash.slice(1));
</script>
</body>
</html>
