<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ library · The Crate</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#0c0c12">
<style>
  :root {
    --bg: #0c0c12; --panel: #15151d; --line: #282834; --text: #f0eef8; --dim: #a4a2b6;
    --hot: #c8102e; --ok: #9be36b; --warn: #ffc24a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "Helvetica Neue", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 56px 40px 96px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 58px; height: 58px; flex: none; }
  h1 { font-size: 54px; line-height: .95; letter-spacing: -.03em; margin: 0; font-weight: 800; }
  h1 span { color: var(--hot); }
  .sub { color: var(--dim); margin-top: 10px; }
  .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, a.ghost { font: inherit; font-weight: 700; border: 0; border-radius: 999px; cursor: pointer; padding: 14px 26px; background: var(--hot); color: #ffffff; transition: transform .08s, opacity .2s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost, a.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 10px 18px; font-weight: 600; text-decoration: none; display: inline-block; }
  input, select { background: #09090e; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 15px inherit; font-family: inherit; min-width: 0; }
  input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: r 1s linear infinite; vertical-align: -1px; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 40px 0 14px; }
  .stat { background: var(--panel); padding: 22px 24px; min-width: 0; }
  .stat b { display: block; font-size: 32px; line-height: 1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--dim); font-size: 14px; display: block; margin-top: 10px; }
  .stat .word { font-size: 17px; line-height: 1.3; font-weight: 600; letter-spacing: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .alert { margin-top: 32px; padding: 14px 18px; border: 1px solid var(--warn); border-radius: 12px; color: var(--warn); }
  .alert[hidden] { display: none; }
  .alert + .strip { margin-top: 14px; }
  .decks { color: var(--dim); font-size: 14.5px; display: grid; gap: 4px; margin-bottom: 36px; }
  .note { color: var(--dim); font-size: 14.5px; min-height: 18px; }
  .note.bad { color: var(--warn); }

  /* The genre pills: pick one to see its songs. */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pills button, .pick button { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .pills button em { font-style: normal; color: var(--dim); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .pills button[aria-pressed="true"], .pick button[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #ffffff; }
  .pills button[aria-pressed="true"] em { color: #ffd9de; }
  .pills button.todo { border-color: #6b5a1a; color: var(--warn); }
  .pills button.todo[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1a1400; }
  .pills button.todo[aria-pressed="true"] em { color: #4a3a00; }
  .pills .chip { display: inline-flex; }
  .pills .chip button:first-child { border-radius: 999px 0 0 999px; border-right: 0; }
  .pills .chip button.x { border-radius: 0 999px 999px 0; padding: 8px 11px; color: var(--warn); }
  .pills button.more { border-style: dashed; color: var(--dim); }
  .bar { display: flex; gap: 10px; margin: 18px 0 10px; }
  .bar input { flex: 1; }
  .addrow { display: flex; gap: 8px; margin-top: 12px; max-width: 460px; }
  .addrow[hidden] { display: none; }
  .addrow input { flex: 1; }
  .addrow button { padding: 10px 20px; }

  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .n { flex: 1 1 300px; min-width: 0; overflow-wrap: anywhere; }
  .n small { color: var(--dim); font-size: 14.5px; display: block; }
  .tag { font: 700 13px var(--mono); padding: 3px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .tag.bpm { color: var(--text); min-width: 46px; text-align: center; }
  .g { display: inline-block; font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .g.main { background: #2a1218; border-color: #6b1c2a; color: #ff9aa8; }
  .g.none { color: var(--warn); border-color: #6b5a1a; }
  .gs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .top > button.ghost { padding: 7px 14px; font-size: 14px; }
  .edit { margin-top: 12px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: grid; gap: 12px; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button.first { box-shadow: 0 0 0 2px #ffffff inset; }
  .edit .how { color: var(--dim); font-size: 14.5px; }
  .edit .how button { background: none; border: 0; border-bottom: 1px dotted var(--dim); border-radius: 0; padding: 0; color: var(--dim); font-weight: 600; font-size: 14.5px; }
  .edit .how button:hover { color: var(--text); }
  .empty { color: var(--dim); padding: 28px 0; border-bottom: 1px solid var(--line); }
  #more { margin-top: 18px; }
  @media (max-width: 820px) { main { padding: 32px 16px 72px; } .strip { grid-template-columns: 1fr 1fr; } h1 { font-size: 40px; } .brand img { width: 44px; height: 44px; } .bar { flex-wrap: wrap; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand"><img src="/icon.svg" alt=""><h1>DJ <span>library</span></h1></div>
      <div class="sub">Every song with its tempo, key and genres, ready on your decks. Fix a genre here and your USB and rekordbox follow.</div>
    </div>
    <div class="acts">
      <a class="ghost" href="/">&larr; The Crate</a>
      <button class="ghost" id="run">Update decks now</button>
    </div>
  </header>

  <div class="alert" id="alert" hidden></div>
  <div class="strip">
    <div class="stat"><b id="sAll">&nbsp;</b><small>songs</small></div>
    <div class="stat"><b id="sSorted">&nbsp;</b><small>sorted into genres</small></div>
    <div class="stat"><b id="sNone">&nbsp;</b><small>with no genre yet</small></div>
    <div class="stat"><b class="word" id="sDecks">&nbsp;</b><small id="sDecksNote">&nbsp;</small></div>
  </div>
  <div class="decks" id="decks"></div>

  <div class="pills" id="pills"></div>
  <div class="addrow" id="addRow" hidden>
    <input id="addName" maxlength="40" placeholder="A new genre, like Melodic Bass" aria-label="New genre name">
    <button id="addGo">Add</button>
  </div>
  <div class="note" id="note" role="status"></div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search a song or artist" aria-label="Search">
    <select id="sort" aria-label="Sort by">
      <option value="artist">Artist A to Z</option>
      <option value="bpm">Tempo, slow to fast</option>
      <option value="key">Key (mixing wheel)</option>
    </select>
  </div>
  <ul id="songs"></ul>
  <button class="ghost" id="more" hidden></button>
</main>

<script>
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
}
const NONE = 'No genre yet';
// The mixing wheel (Camelot) number for each key: neighbours on the wheel mix cleanly.
const WHEEL = { C: '8B', G: '9B', D: '10B', A: '11B', E: '12B', B: '1B', 'F#': '2B', 'C#': '3B', Ab: '4B', Eb: '5B', Bb: '6B', F: '7B',
  Am: '8A', Em: '9A', Bm: '10A', 'F#m': '11A', 'C#m': '12A', Abm: '1A', Ebm: '2A', Bbm: '3A', Fm: '4A', Cm: '5A', Gm: '6A', Dm: '7A' };
const wheelNo = k => { const w = WHEEL[k]; return w ? parseInt(w) * 2 + (w.endsWith('B') ? 1 : 0) : 999; };

let S = null, raw = '';       // what the app last said, and its text (to skip drawing when nothing changed)
let view = 'all';             // 'all', 'none', or a genre name
let open = new Set();         // songs whose genre picker is open
let kept = new Set();         // songs you just fixed stay in view until you change the filter (so a second genre is one more tap)
let tidy = false;             // the genre pills show their remove buttons
let shown = 80;               // how many rows are drawn (more on "Show more")
let saving = 0;

function say(text, bad) { const n = $('note'); n.textContent = text || ''; n.className = 'note' + (bad ? ' bad' : ''); }

async function load() {
  if (document.hidden || saving) return;
  try {
    const r = await fetch('/api/dj'); const t = await r.text();
    if (r.ok && t !== raw && !saving) { raw = t; S = JSON.parse(t); draw(); }
  } catch (e) { /* the app is restarting: the next round gets it */ }
}
async function post(path, body) {
  saving++;
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    S = j; raw = ''; say('');
  } catch (e) { say(e.message, true); }
  saving--; draw();
}

function setGenres(song, list) {
  kept.add(song.key);
  song.genres = list; song.from = 'your pick';  // shown at once; the app's answer follows
  post('/api/dj/genres', { key: song.key, genres: list });
  draw();
}

function picker(song) {
  const box = el('div', { className: 'edit' });
  const pick = el('div', { className: 'pick' });
  S.list.forEach(name => {
    const on = song.genres.includes(name);
    const b = el('button', { textContent: name, className: on && song.genres[0] === name && song.genres.length > 1 ? 'first' : '' });
    b.setAttribute('aria-pressed', on);
    b.onclick = () => setGenres(song, on ? song.genres.filter(x => x !== name) : [...song.genres, name]);
    pick.append(b);
  });
  const other = el('button', { textContent: '+ Another genre', className: 'more' });
  other.onclick = () => {
    const name = (prompt('A new genre for this song (it joins your list):') || '').trim();
    if (name) setGenres(song, [...song.genres, name.slice(0, 40)]);
  };
  pick.append(other);
  box.append(pick);
  if (song.genres.length > 1) {
    const row = el('div', { className: 'how' }, 'Main genre (the Genre column on the decks): ');
    song.genres.forEach((name, i) => {
      if (i) row.append(' · ');
      if (!i) return row.append(el('b', { textContent: name }));
      const b = el('button', { textContent: 'make it ' + name });
      b.onclick = () => setGenres(song, [name, ...song.genres.filter(x => x !== name)]);
      row.append(b);
    });
    box.append(row);
  }
  const how = el('div', { className: 'how' });
  if (song.from === 'your pick') {
    const back = el('button', { textContent: 'back to automatic' });
    back.onclick = () => { kept.add(song.key); post('/api/dj/genres', { key: song.key, genres: null }); };
    how.append('Your pick. ', back);
  } else how.append(song.from ? 'Sorted by ' + song.from + '. Tap a genre to change it.' : 'Nothing on this song says what it is. Tap its genre.');
  if (song.heard.length) how.append(' Labels on it: ' + song.heard.join(', ') + '.');
  box.append(how);
  return box;
}

function row(song) {
  const isOpen = open.has(song.key);
  const name = el('div', { className: 'n' }, song.title, el('small', { textContent: song.artist || 'Unknown artist' }));
  const gs = el('div', { className: 'gs' });
  if (song.genres.length) song.genres.forEach((g, i) => gs.append(el('span', { className: 'g' + (i ? '' : ' main'), textContent: g })));
  else gs.append(el('span', { className: 'g none', textContent: NONE }));
  const edit = el('button', { className: 'ghost', textContent: isOpen ? 'Done' : 'Edit' });
  edit.setAttribute('aria-expanded', isOpen);
  edit.onclick = () => { isOpen ? open.delete(song.key) : open.add(song.key); draw(); };
  const top = el('div', { className: 'top' }, name, gs,
    el('span', { className: 'tag bpm', textContent: song.bpm ? String(Math.round(song.bpm * 10) / 10) : '—', title: 'Tempo (beats a minute)' }),
    el('span', { className: 'tag', textContent: song.tone ? song.tone + (WHEEL[song.tone] ? ' · ' + WHEEL[song.tone] : '') : '—', title: 'Key, and its number on the mixing wheel' }),
    el('span', { className: 'tag', textContent: song.kind }), edit);
  const li = el('li', {}, top);
  if (isOpen) li.append(picker(song));
  return li;
}

function inView(song) {
  if (kept.has(song.key)) return true;
  return view === 'all' || (view === 'none' ? !song.genres.length : song.genres.includes(view));
}

function pill(label, count, key, cls) {
  const b = el('button', { className: cls || '' }, label, el('em', { textContent: count }));
  b.setAttribute('aria-pressed', view === key);
  b.onclick = () => { view = key; kept.clear(); open.clear(); shown = 80; draw(); window.scrollTo({ top: $('pills').offsetTop - 20 }); };
  return b;
}

function draw() {
  if (!S) return;
  const songs = S.songs, none = songs.filter(s => !s.genres.length).length;
  $('sAll').textContent = songs.length; $('sSorted').textContent = songs.length - none; $('sNone').textContent = none;
  // where the decks stand
  const d = $('sDecks'), dn = $('sDecksNote');
  d.textContent = '';
  if (S.busy) { d.append(el('span', { className: 'spin' }), 'Updating your decks'); dn.textContent = 'a minute or two when there are new songs'; }
  else if (S.waiting || saving) { d.append(el('span', { className: 'spin' }), 'Saved'); dn.textContent = 'your decks update in a few seconds'; }
  else { d.append(el('span', { className: 'dot ' + (S.problem ? 'warn' : 'ok') }), S.problem ? 'Needs a look' : 'Decks up to date'); dn.textContent = 'updates by itself after every sync'; }
  $('run').disabled = S.busy;
  const a = $('alert'); a.hidden = !S.problem; a.textContent = S.problem ? S.problem.replace(/^\S+ \S+\s+/, '') : '';
  const lines = [];
  const when = l => l ? l.slice(0, 16) : '';
  const what = l => l.replace(/^\S+ \S+\s+/, '');
  if (!S.analyser) lines.push('Tempo and key are not set up on this Mac yet (the next sync sets it up, or run install.sh). Your decks work them out when you load a song meanwhile.');
  if (S.usb) lines.push(S.usbIn ? (S.engine ? (S.lastEngine ? what(S.lastEngine) + '  ·  ' + when(S.lastEngine) : 'Engine DJ on "' + S.usb + '": ready to be written')
      : '"' + S.usb + '" has no Engine DJ library yet: plug it into the deck once and it makes one.')
    : 'USB "' + S.usb + '" is not plugged in: its Engine DJ library catches up when you plug it in.');
  else lines.push('No USB chosen yet (pick one on The Crate\'s main page): the Engine DJ library goes on it.');
  lines.push(S.rekordbox ? (S.lastRekordbox ? what(S.lastRekordbox) + '  ·  ' + when(S.lastRekordbox) : 'rekordbox: ready to be written')
    : 'rekordbox is not on this Mac (nothing to do; install it and its library fills in by itself).');
  const dk = $('decks'); dk.textContent = ''; lines.forEach(l => dk.append(el('div', { textContent: l })));

  // the pills
  const p = $('pills'); p.textContent = '';
  p.append(pill('All', songs.length, 'all'));
  if (none || view === 'none') p.append(pill(NONE, none, 'none', 'todo'));
  const extra = [...new Set(songs.flatMap(s => s.genres))].filter(g => !S.list.includes(g));
  [...S.list, ...extra].forEach(g => {
    const n = songs.filter(s => s.genres.includes(g)).length;
    if (!tidy) return p.append(pill(g, n, g));
    const x = el('button', { className: 'x', textContent: '×', title: 'Take ' + g + ' off your list' });
    x.setAttribute('aria-label', 'Take ' + g + ' off your list');
    x.onclick = () => {
      if (!confirm('Take "' + g + '" off your list?' + (n ? ' Its ' + n + ' song' + (n > 1 ? 's' : '') + ' go back to their other genres, or to "' + NONE + '".' : ''))) return;
      if (view === g) view = 'all';
      post('/api/dj/list', { remove: g });
    };
    p.append(el('span', { className: 'chip' }, pill(g, n, g), x));
  });
  const add = el('button', { className: 'more', textContent: '+ Add genre' });
  add.onclick = () => { $('addRow').hidden = !$('addRow').hidden; if (!$('addRow').hidden) $('addName').focus(); };
  const tid = el('button', { className: 'more', textContent: tidy ? 'Done' : 'Remove genres' });
  tid.onclick = () => { tidy = !tidy; draw(); };
  p.append(add, tid);

  // the songs
  const q = $('q').value.trim().toLowerCase(), by = $('sort').value;
  let rows = songs.filter(s => inView(s) && (!q || (s.title + ' ' + s.artist).toLowerCase().includes(q)));
  if (by === 'bpm') rows = [...rows].sort((a, b) => (a.bpm || 999) - (b.bpm || 999));
  if (by === 'key') rows = [...rows].sort((a, b) => wheelNo(a.tone) - wheelNo(b.tone) || a.bpm - b.bpm);
  const ul = $('songs'); ul.textContent = '';
  if (view === 'none') rows.forEach(s => { if (!s.genres.length) open.add(s.key); });  // the to-do pile: pickers open
  rows.slice(0, shown).forEach(s => ul.append(row(s)));
  if (!rows.length) ul.append(el('div', { className: 'empty', textContent: view === 'none' && !q ? 'Every song has a genre. Nice.' : 'No songs here.' }));
  const m = $('more'); m.hidden = rows.length <= shown; m.textContent = 'Show ' + Math.min(80, rows.length - shown) + ' more';
}

$('more').onclick = () => { shown += 80; draw(); };
$('q').oninput = () => { shown = 80; draw(); };
$('sort').onchange = draw;
$('run').onclick = () => { say('Updating your decks now.'); post('/api/dj/run', {}); };
function addGenre() {
  const name = $('addName').value.trim(); if (!name) return;
  $('addName').value = ''; $('addRow').hidden = true;
  post('/api/dj/list', { add: name });
}
$('addGo').onclick = addGenre;
$('addName').onkeydown = e => { if (e.key === 'Enter') addGenre(); };
document.addEventListener('visibilitychange', load);
load(); setInterval(load, 4000);
</script>
</body>
</html>
